name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write      # Required for SLSA provenance OIDC token generation
  attestations: write  # Required to push provenance and SBOM attestations

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: babili/engine
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image with Provenance
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.hardened
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_ENV=production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=babili/engine:buildcache
          cache-to: type=registry,ref=babili/engine:buildcache,mode=max
          
          # Generate SLSA Provenance and SBOM
          provenance: mode=max
          sbom: true
